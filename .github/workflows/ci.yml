name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api-and-specs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CycleSync.Api/CycleSync.Api.csproj && dotnet restore CycleSync.AppHost/CycleSync.AppHost.csproj && dotnet restore ../tests/CycleSync.Specs/CycleSync.Specs.csproj
      - name: Build API
        run: dotnet build CycleSync.Api/CycleSync.Api.csproj --configuration Release --no-restore
      - name: Build AppHost
        run: dotnet build CycleSync.AppHost/CycleSync.AppHost.csproj --configuration Release --no-restore
      - name: Specs
        run: dotnet test ../tests/CycleSync.Specs/CycleSync.Specs.csproj --configuration Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/CycleSync.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/CycleSync.Web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
